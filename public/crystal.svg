<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="-10 -10 276 252"
  width="276"
  height="252"
  fill="none"
  role="img"
  aria-label="Vue"
>
  <style>
    svg { color: #232135 }

    .facets polygon { stroke: currentColor; stroke-opacity: .18; stroke-width: .8 }
    .glow { opacity: .35; animation: breathe 7s ease-in-out infinite }

    .hue { animation: hue 9s linear infinite }
    .hue:nth-child(2) { animation-delay: -1.8s }
    .hue:nth-child(3) { animation-delay: -3.6s }
    .hue:nth-child(4) { animation-delay: -5.4s }
    .hue:nth-child(5) { animation-delay: -7.2s }

    @keyframes hue {
      0%, 100% { stop-color: #7b5cff }
      17% { stop-color: #ff2d6f }
      33% { stop-color: #ff9b2f }
      50% { stop-color: #f7e04d }
      67% { stop-color: #3fe08a }
      83% { stop-color: #2fc9ff }
    }

    @keyframes breathe { 50% { opacity: .6 } }

    @media (prefers-reduced-motion: reduce) {
      .hue, .glow { animation: none }
    }
  </style>

  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop class="hue" offset="0" stop-color="#7b5cff" />
      <stop class="hue" offset="0.25" stop-color="#ff2d6f" />
      <stop class="hue" offset="0.5" stop-color="#f7e04d" />
      <stop class="hue" offset="0.75" stop-color="#3fe08a" />
      <stop class="hue" offset="1" stop-color="#2fc9ff" />
    </linearGradient>

    <linearGradient id="core" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3fe08a" />
      <stop offset="1" stop-color="#0d6f6a" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>

  <polygon class="glow" points="0.0,0.0 128.0,220.8 256.0,0.0 204.8,0.0 128.0,132.5 51.2,0.0" fill="url(#iris)" filter="url(#glow)" />
  <polygon points="0.0,0.0 128.0,220.8 256.0,0.0 204.8,0.0 128.0,132.5 51.2,0.0" fill="currentColor" fill-opacity="0.07" />

  <g class="facets">
    <polygon points="0.0,0.0 41.0,70.7 83.5,55.6" fill="url(#iris)" fill-opacity="0.5" />
    <polygon points="0.0,0.0 83.5,55.6 51.2,0.0" fill="url(#iris)" fill-opacity="0.22" />
    <polygon points="41.0,70.7 87.0,150.1 111.1,103.3" fill="url(#iris)" fill-opacity="0.34" />
    <polygon points="41.0,70.7 111.1,103.3 83.5,55.6" fill="url(#iris)" fill-opacity="0.16" />
    <polygon points="87.0,150.1 128.0,220.8 128.0,132.5" fill="url(#iris)" fill-opacity="0.46" />
    <polygon points="87.0,150.1 128.0,132.5 111.1,103.3" fill="url(#iris)" fill-opacity="0.26" />
    <polygon points="256.0,0.0 215.0,70.7 172.5,55.6" fill="url(#iris)" fill-opacity="0.42" />
    <polygon points="256.0,0.0 172.5,55.6 204.8,0.0" fill="url(#iris)" fill-opacity="0.3" />
    <polygon points="215.0,70.7 169.0,150.1 144.9,103.3" fill="url(#iris)" fill-opacity="0.2" />
    <polygon points="215.0,70.7 144.9,103.3 172.5,55.6" fill="url(#iris)" fill-opacity="0.38" />
    <polygon points="169.0,150.1 128.0,220.8 128.0,132.5" fill="url(#iris)" fill-opacity="0.28" />
    <polygon points="169.0,150.1 128.0,132.5 144.9,103.3" fill="url(#iris)" fill-opacity="0.5" />
  </g>

  <g class="facets">
    <polygon points="51.2,0.0 89.6,66.6 113.0,25.6" fill="url(#core)" fill-opacity="0.95" />
    <polygon points="51.2,0.0 113.0,25.6 97.9,0.0" fill="url(#core)" fill-opacity="0.7" />
    <polygon points="89.6,66.6 128.0,133.1 128.0,51.2" fill="#123f52" fill-opacity="1" />
    <polygon points="89.6,66.6 128.0,51.2 113.0,25.6" fill="url(#core)" fill-opacity="0.8" />
    <polygon points="204.8,0.0 166.4,66.6 143.0,25.6" fill="url(#core)" fill-opacity="0.75" />
    <polygon points="204.8,0.0 143.0,25.6 158.1,0.0" fill="url(#core)" fill-opacity="0.55" />
    <polygon points="166.4,66.6 128.0,133.1 128.0,51.2" fill="#123f52" fill-opacity="0.82" />
    <polygon points="166.4,66.6 128.0,51.2 143.0,25.6" fill="url(#core)" fill-opacity="0.62" />
  </g>

  <polygon points="0.0,0.0 128.0,220.8 256.0,0.0 204.8,0.0 128.0,132.5 51.2,0.0" stroke="url(#iris)" stroke-width="2.2" />
  <polygon points="51.2,0.0 128.0,133.1 204.8,0.0 157.4,0.0 128.0,51.2 97.9,0.0" stroke="#3fe08a" stroke-opacity="0.5" stroke-width="1.4" />
</svg>
